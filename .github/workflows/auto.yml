# Every five minutes (until 18 November 2026: every half hour): is there work? (docs/AUTOMATION.md; scripts/auto/tick.py)
#
# The senior author, 18 November 2026, 13:34 Athens: "can the answers get ... answered by themselves? and can they get answered almost instantly? one day or two
# is too ... much"; 13:36: "our site's answers have to be given much faster". What the run list showed that day: GitHub started this workflow, asked for at :07
# and :37, about once in 60 to 85 minutes; a run that worked took 7 to 22 minutes; and a question that got no answer was left for a day or two. So: it is asked
# for every five minutes (GitHub starts a scheduled run when it has a machine free: more chances, shorter waits); a question a person sent is worked on first and
# alone, and what was written for it is kept and published at once, before the system's own questions; and the lane tries again by itself (lane 19).
# The site's own server can start this workflow the moment a question is sent (workflow_dispatch), once the senior author has given it a key that may do only that.
#
# The senior author, 15 November 2026: "automatically deployed every 30 minutes"; "WE HAVE TO MAKE THE SITE EXPAND ON ITS OWN".
#
#   tick    on the smallest machine, under a minute: has the question store changed? has a listed question no answer yet, and
#           is there room in today's free model allowance? is what the site is built from different from what is published?
#   work    only when the tick says so: the scout reads what visitors asked; a question a visitor sent becomes a question
#           on the system's own list (scripts/auto/ask.py); the finders look for papers and official pages; the machine
#           lane writes answers (scripts/auto/lane.py: every sentence tied to its source's own words, checked, and held
#           to the site's rules).
#   publish only when what the site is built from has changed (new answers by the system, or the editor's own work on main):
#           the publishing run is started (deploy.yml): the site is built, checked and published, with every gate of a release.
#
# A private repository has a monthly amount of free machine time, so the tick is cheap and the work is counted: at most six
# writing runs and eight publishings a day (scripts/auto/tick.py). Nothing here can cost money: the models are used inside
# Cloudflare's free daily allowance (scripts/auto/llm.py stops before it), and GitHub stops when the free minutes are used.
# The editor's session cannot read GitHub's logs: every run keeps its notes in the repository, cleaned of both secrets.
name: Auto

on:
  schedule:
    - cron: "3-58/5 * * * *"   # every five minutes, away from the full hour (GitHub starts scheduled runs late when many start at once, and five minutes is the shortest it allows)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/auto/requests/tick-*.json"

permissions:
  contents: write
  actions: write   # to start the publishing run (a push made by a run does not start another workflow; a request through the API does)

concurrency:
  group: auto
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest   # (17 November 2026: the small runner did not start twice in one hour, 16:15 and 16:33 UTC, and both runs were cancelled; the repository is public, so the usual runner costs nothing)
    timeout-minutes: 5
    outputs:
      work: ${{ steps.plan.outputs.work }}
      scout: ${{ steps.plan.outputs.scout }}
      lane: ${{ steps.plan.outputs.lane }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/auto
            data/auto
            data/site/wanted.json
            data/site/version.json
      - id: plan
        name: What is there to do?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # a second free model service; empty until the senior author adds it, and then the lane uses it by itself
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}       # three more services with a free plan (16 November 2026); each is empty until the senior author adds its key
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git rm -q --ignore-unmatch data/auto/requests/tick-*.json || true
          python3 -I scripts/auto/tick.py plan || { echo "work=false" >> "$GITHUB_OUTPUT"; echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "keep=true" >> "$GITHUB_OUTPUT"; echo "the look itself failed" > data/auto/tick-failed.txt; }
      - name: Remember the look
        if: steps.plan.outputs.keep == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/auto
          git diff --cached --quiet || git commit -q -m "Tick: looked"
          git push -q || (git pull -q --rebase -X theirs && git push -q) || (sleep 7 && git pull -q --rebase -X theirs && git push -q)   # what a run found wins a clash with another run's copy of the same file

  work:
    needs: tick
    if: needs.tick.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40   # (a last stop only. 19 November 2026: every step has its own minutes: the sent questions 8 and a little, the system's own 3 + 4 + 8, and the lane's every call a clock)
    outputs:
      deploy: ${{ steps.after.outputs.deploy }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # a second free model service; empty until the senior author adds it, and then the lane uses it by itself
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}       # three more services with a free plan (16 November 2026); each is empty until the senior author adds its key
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DO_SCOUT: ${{ needs.tick.outputs.scout }}
      DO_LANE: ${{ needs.tick.outputs.lane }}
      GH_TOKEN: ${{ github.token }}   # to ask for a publishing in the middle of the work, as soon as a sent question has its answer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: The vectors made before (so that only new texts are embedded)
        uses: actions/cache@v6
        with:
          path: site/insight/.cache
          key: insight-vectors-${{ hashFiles('site/insight/model.json', 'site/insight/vendor/*.onnx') }}-${{ github.run_id }}
          restore-keys: |
            insight-vectors-${{ hashFiles('site/insight/model.json', 'site/insight/vendor/*.onnx') }}-
      - name: Python packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy tokenizers onnxruntime
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Work, with notes
        run: |
          set +e
          L="$RUNNER_TEMP/auto.log"; : > "$L"
          # (18 November 2026) each step's note carries the time it began (UTC): where a run's minutes went must be readable from its notes
          step() { echo "== $1 [$(date -u +%H:%M:%S)]" >> "$L"; shift; "$@" >> "$L" 2>&1; c=$?; if [ $c -ne 0 ]; then echo "!! this step failed ($c)" >> "$L"; fi; return 0; }
          if [ "$DO_SCOUT" = "true" ]; then
            step "build the page and Insight's index (the scout ranks a question as the page does)" node site/build.js
            step "read the question store" python3 -I scripts/auto/fetch_questions.py "$RUNNER_TEMP/questions.json" --auto "$RUNNER_TEMP/auto-sent.json"
            step "the scout: what people asked, and what the site lacks" python3 -I scripts/auto/scout.py --questions "$RUNNER_TEMP/questions.json" --unknown "$RUNNER_TEMP/unknown-names.json"
            # (17 November 2026, decision 27 step a) "hardcode is not enough our ai has to correct and update itself with all possible relevant
            # online searches": the unknown words of sent questions (never the questions) are looked up in open name lists that allow it
            # (GBIF, RxNorm, PubChem); what is learned is kept in data/auto/names/learned.json and read by the next build
            step "names we do not know, looked up in open name lists" python3 -I scripts/auto/names_open.py learn --tokens "$RUNNER_TEMP/unknown-names.json"
            step "remember what was read" python3 -I scripts/auto/look.py --done "$RUNNER_TEMP/questions.json"
            step "a question a visitor sent becomes a question on the system's own list (our words, never theirs)" python3 -I scripts/auto/ask.py run --marker "$RUNNER_TEMP/new-items"
            # (site 2.17, 18 November 2026; the senior author: "it should send the question immediately in every instance and the user should be notified")
            # the questions the page sent by itself, because the site had no answer. Nobody pressed anything to send these, so their words are never
            # written into the repository: the scout's second pass keeps everything it writes in this run's own temporary folder, and what reaches the
            # repository is OUR wording of the question (ask.py) and a fingerprint of the words, as for every other question
            if [ -s "$RUNNER_TEMP/auto-sent.json" ]; then
              mkdir -p "$RUNNER_TEMP/private"
              step "the scout on the questions the page sent by itself (their words stay in this run's own folder)" python3 -I scripts/auto/scout.py --questions "$RUNNER_TEMP/auto-sent.json" --out "$RUNNER_TEMP/private" --report "$RUNNER_TEMP/private/MISSING.md" --no-cards --unknown "$RUNNER_TEMP/unknown-names-2.json"
              step "names we do not know among them, looked up in open name lists" python3 -I scripts/auto/names_open.py learn --tokens "$RUNNER_TEMP/unknown-names-2.json"
              if [ -s "$RUNNER_TEMP/private/report.json" ]; then step "they too become questions on the system's own list (our words, never theirs)" python3 -I scripts/auto/ask.py run --report "$RUNNER_TEMP/private/report.json" --marker "$RUNNER_TEMP/new-items"; fi
            fi
          fi
          # (18 November 2026, lane 19) what was written so far is kept and, if the site is built from something new, published at once: a person who sent a
          # question does not wait for the system's own questions. The fingerprint that was asked for is remembered, so that the end of the run asks again only
          # if something more has changed.
          keep_now() {
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            python3 -I scripts/auto/tick.py settle >> "$L" 2>&1 || true   # (18 November 2026) an answer another run published meanwhile is not replaced by this run's draft that did not pass
            git add -A data/auto >> "$L" 2>&1; git add -A docs/MISSING.md >> "$L" 2>&1 || true
            if git diff --cached --quiet; then echo "   nothing new to keep yet" >> "$L"; return 0; fi
            git commit -q -m "Auto: what the lane wrote for the questions people sent" >> "$L" 2>&1
            git push -q >> "$L" 2>&1 || (git pull -q --rebase -X theirs && git push -q) >> "$L" 2>&1 || (sleep 7 && git pull -q --rebase -X theirs && git push -q) >> "$L" 2>&1
            if GITHUB_OUTPUT=/dev/null python3 -I scripts/auto/tick.py after 2>> "$L" | grep -q "^deploy=true"; then
              python3 -I scripts/auto/tick.py inputs > "$RUNNER_TEMP/asked-inputs" 2>> "$L"
              step "ask for a publishing now" python3 -I scripts/auto/tick.py publish
            fi
          }
          # (18 November 2026, 20:50 Athens) The first question that started a run by itself, four seconds after it was typed, waited behind the clock's run,
          # which was 36 minutes into the system's own questions: GitHub lets one run of this workflow work and one wait. So a run gives way: before each
          # step of the system's OWN questions it asks GitHub whether a run is waiting, and where one is it leaves the rest to that run, which reads the
          # new question first. Where GitHub cannot be asked, the run works on as before.
          own() { if python3 -I scripts/auto/lane.py waiting >> "$L" 2>&1; then echo "== left to the run that is waiting (a new question came): $1" >> "$L"; else step "$@"; fi; }
          if [ "$DO_LANE" = "true" ] || [ -f "$RUNNER_TEMP/new-items" ]; then   # (a question that was just listed is worked on in this same run)
            # (19 November 2026; the senior author, 18 November, 23:42 Athens: "like 5 minutes pass and i don't have an answer ... it should be answered almost
            # immediately") the two searches run at the same time (each writes its own files; 24 and 56 seconds one after the other on 18 November), and the
            # lane is on a clock: its sources are read at once, one question has seven minutes at most (scripts/auto/lane.py, QUESTION_SECONDS), and no step
            # can sit until GitHub stops the run, as one did for 40 minutes that evening
            echo "== official pages and papers for the questions people sent, at the same time [$(date -u +%H:%M:%S)]" >> "$L"
            python3 -I scripts/auto/official.py find --sent --max 4 --minutes 2 > "$RUNNER_TEMP/find-official.log" 2>&1 & po=$!
            python3 -I scripts/auto/papers.py find --sent --max 4 --minutes 3 > "$RUNNER_TEMP/find-papers.log" 2>&1 & pp=$!
            wait $po; co=$?; wait $pp; cp=$?
            cat "$RUNNER_TEMP/find-official.log" "$RUNNER_TEMP/find-papers.log" >> "$L"
            if [ $co -ne 0 ]; then echo "!! the search for official pages failed ($co)" >> "$L"; fi
            if [ $cp -ne 0 ]; then echo "!! the search for papers failed ($cp)" >> "$L"; fi
            step "the lane writes: the questions people sent, first and alone" python3 -I -u scripts/auto/lane.py run --sent --max 3 --minutes 9
            echo "== keep and publish what was written for them [$(date -u +%H:%M:%S)]" >> "$L"; keep_now
            own "the system asks by itself: what people ask about every drug, where a page lacks it" python3 -I scripts/auto/grow.py run
            own "official pages for the questions not yet searched" python3 -I scripts/auto/official.py find --max 12 --minutes 3
            own "papers for the questions not yet searched" python3 -I scripts/auto/papers.py find --max 12 --minutes 4
            own "the lane writes" python3 -I -u scripts/auto/lane.py run --max 3 --minutes 8 --give-way
            step "count this run" python3 -I scripts/auto/tick.py did lane
          fi
          step "has what the site is built from changed?" env GITHUB_OUTPUT=/dev/null python3 -I scripts/auto/tick.py after --asked "$RUNNER_TEMP/asked-inputs"
      - name: Keep the records
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/auto/lane
          python3 -I - <<'PY'
          import os, re, pathlib
          src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "auto.log"
          t = src.read_text(encoding="utf-8", errors="replace") if src.exists() else "no notes were written\n"
          for k in ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "GROQ_API_KEY", "MISTRAL_API_KEY", "GEMINI_API_KEY", "OPENROUTER_API_KEY"):
              v = (os.environ.get(k) or "").strip()
              if len(v) >= 6: t = t.replace(v, "***")
          t = re.sub(r"(accounts/)[0-9a-fA-F]{32}", r"\1***", t)
          keep = [l for l in t.splitlines() if not re.match(r"\s*(wrote|copied|insight:|Myth or fact|built dist)", l)]
          pathlib.Path("data/auto/lane/_last-auto-run.txt").write_text("\n".join(keep)[-12000:] + "\n", encoding="utf-8")
          PY
          python3 -I scripts/auto/tick.py settle || true   # (18 November 2026) an answer another run published meanwhile is not replaced by this run's draft that did not pass
          git add -A data/auto; git add -A docs/MISSING.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "Auto: what the scout read and what the lane wrote"
          git push -q || (git pull -q --rebase -X theirs && git push -q) || (sleep 7 && git pull -q --rebase -X theirs && git push -q)   # what a run found wins a clash with another run's copy of the same file
      - id: after
        name: Has what the site is built from changed?
        if: always()
        run: python3 -I scripts/auto/tick.py after --asked "$RUNNER_TEMP/asked-inputs" || echo "deploy=false" >> "$GITHUB_OUTPUT"

  # The publishing is a run of its own (deploy.yml: build, every gate, upload, proof), started through GitHub's API. (Calling
  # deploy.yml as a part of this workflow did not publish on 15 November 2026 at 21:58 UTC, and left no note to say why.)
  publish:
    needs: [tick, work]
    if: ${{ always() && (needs.tick.outputs.deploy == 'true' || needs.work.outputs.deploy == 'true') }}
    runs-on: ubuntu-latest   # (17 November 2026: the small runner did not start twice in one hour, 16:15 and 16:33 UTC, and both runs were cancelled; the repository is public, so the usual runner costs nothing)
    timeout-minutes: 3
    steps:
      - name: Start the publishing run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          req = urllib.request.Request("https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/workflows/deploy.yml/dispatches", data=json.dumps({"ref": "main"}).encode(), method="POST",
                                       headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "pharmakon-auto"})
          print("the publishing run was asked for:", urllib.request.urlopen(req, timeout=30).status)
          PY
