# The workshop for models of our own (docs/AUTOMATION.md, decision 23; scripts/auto/nli.py, workshop.py, own.py).
# The senior author, 16 November 2026: "if we can make our own ai we should ... our own autonomous self expanding ai".
#
# It starts when the editor puts a request in data/auto/requests, or by hand:
#   nli-*.json  {"models": [...]}                                   open checker models sit the whole exam as they are
#   own-*.json  {"do": "export", "model": "...", "as": "pharmakon-check-0"}   a model is made into a file of numbers, sits
#                                                                    the exam AS THAT FILE, and becomes a candidate
#   train-*.json {"from": "...", "as": "pharmakon-check-1"}         an open model's top layers learn from our own lessons
#                                                                    (data/auto/own/teach, made by the workflow "Lessons"),
#                                                                    and the result is made into a file and sits the exams
#
# Two jobs, on purpose. "make" fetches models and packages from outside and runs them: it may only READ the repository and
# is given no key at all. "keep" runs nothing from outside: it takes the plain files "make" left (numbers, tables, records)
# and puts them where they belong: the records into the repository, a model's file among the repository's release files.
# So nothing fetched from outside ever runs where it could write to the repository or see a secret.
name: Workshop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/auto/requests/nli-*.json"
      - "data/auto/requests/own-*.json"
      - "data/auto/requests/train-*.json"

permissions:
  contents: read

concurrency:
  group: workshop
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: The models fetched before
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: nli-models-v2
      - name: Python packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -q transformers sentencepiece protobuf numpy tokenizers onnx onnxruntime
          .venv/bin/pip install -q lettucedetect || echo "the package for the word-marking models was not fetched"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: The work, with notes
        run: |
          set +e
          L="$RUNNER_TEMP/workshop.log"; : > "$L"; mkdir -p out
          ls data/auto/requests/nli-*.json data/auto/requests/own-*.json data/auto/requests/train-*.json 2>/dev/null > out/_handled.txt
          if ls data/auto/requests/nli-*.json >/dev/null 2>&1; then
            python3 -I scripts/auto/nli.py exam --requests --minutes 38 >> "$L" 2>&1 || echo "!! the exam of open models failed ($?)" >> "$L"
          fi
          if ls data/auto/requests/own-*.json >/dev/null 2>&1; then
            python3 -I scripts/auto/own.py --selftest >> "$L" 2>&1 || echo "!! own.py's own check failed ($?)" >> "$L"
            python3 -I scripts/auto/workshop.py --selftest >> "$L" 2>&1 || echo "!! the workshop's own check failed ($?)" >> "$L"
            python3 -I scripts/auto/workshop.py requests >> "$L" 2>&1 || echo "!! the workshop failed ($?)" >> "$L"
          fi
          if ls data/auto/requests/train-*.json >/dev/null 2>&1; then
            python3 -I scripts/auto/train.py --selftest >> "$L" 2>&1 || echo "!! the trainer's own check failed ($?)" >> "$L"
            python3 -I scripts/auto/train.py requests >> "$L" 2>&1 || echo "!! the training failed ($?)" >> "$L"
          fi
          rm -rf out/_trained out/_tok
          grep -v "Warning\|warn\|Loading weights\|shards" "$L" | tail -n 90 | cut -c1-700 > out/_notes.txt
          mkdir -p out/exam && cp data/auto/exam/nli-*.json out/exam/ 2>/dev/null
          ls -la out | cut -c20-200 >> out/_notes.txt
      - name: Hand the plain files to the job that may write
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-out
          path: out/
          retention-days: 5
  keep:
    needs: make
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: The plain files the first job left
        uses: actions/download-artifact@v4
        with:
          name: workshop-out
          path: out/
      - name: Keep them where they belong
        run: |
          set +e
          mkdir -p data/auto/exam data/auto/own/candidates
          cp out/exam/nli-*.json data/auto/exam/ 2>/dev/null
          cp out/_notes.txt data/auto/own/_last-run.txt
          for rec in out/pharmakon-*.json; do
            [ -f "$rec" ] || continue
            case "$rec" in *.scores.json|*.tokenizer.json) continue;; esac
            name="$(basename "$rec" .json)"
            if [ -f "out/$name.onnx" ] && [ -f "out/$name.tokenizer.json" ]; then
              gh release view own-models >/dev/null 2>&1 || gh release create own-models --title "Models of our own" --notes "The files of the models Pharmakon runs by itself (scripts/auto/own.py). Each is named, with its SHA-256 and its numbers on the exam, in data/auto/own/. See NOTICE.md."
              gh release upload own-models "out/$name.onnx" "out/$name.tokenizer.json" --clobber && cp "$rec" "data/auto/own/candidates/$name.json" && cp "out/$name.scores.json" "data/auto/own/candidates/$name.scores.json" 2>/dev/null
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # only the requests the first job saw are taken off (one that arrived meanwhile starts its own run); the names are checked, because the list comes from that job
          grep -E '^data/auto/requests/(nli|own|train)-[0-9A-Za-z._-]+\.json$' out/_handled.txt 2>/dev/null | while read -r f; do git rm -q --ignore-unmatch "$f"; done
          git add -A data/auto   # (the whole folder, never the requests folder by name: when its last request is taken off, that folder is gone; naming it lost a night's lessons in the Lessons workflow on 17 November, and here it would have kept a candidate's file and lost its record)
          git diff --cached --quiet || git commit -q -m "Workshop: what the models said of every card, and the candidates made"
          git push -q || (git pull -q --rebase -X theirs && git push -q) || (sleep 7 && git pull -q --rebase -X theirs && git push -q)
