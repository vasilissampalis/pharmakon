# The machine lane (docs/AUTOMATION.md; scripts/auto/lane.py): answers written by the system from papers it found and read,
# each sentence tied to the paper's own words, checked by a second model and by the site's rules in code.
#
# It starts when the editor puts a request in data/auto/requests (lane-*.json: which questions, how many; probe-*.json: is
# everything within reach?), or by hand. A request is a file in the repository; it is read as data by Python and never
# reaches a command line. It needs the repository's two secrets (the senior author added them on 15 November 2026):
# CLOUDFLARE_API_TOKEN (Workers AI, Workers KV read, Pages) and CLOUDFLARE_ACCOUNT_ID. Neither is ever printed, and the
# run's own notes are cleaned of both before they are kept.
#
# The editor's session cannot read GitHub's logs, so every step writes what happened into one file of notes that is kept in
# the repository (data/auto/lane/_last-run.txt): a step that fails says so there and the run goes on.
#
# It writes records (data/auto/answers, data/auto/lane, data/auto/papers). What the site shows of them is decided by the
# site's build (site/build.js), not here.
name: Lane

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/auto/requests/lane-*.json"
      - "data/auto/requests/probe-*.json"
      - "data/auto/requests/exam-*.json"
      - "data/auto/requests/trial-*.json"
      - "data/auto/requests/grow-*.json"   # (16 November 2026) the system lists its own questions (scripts/auto/grow.py) and the finders search for them
      - "data/auto/requests/blind-*.json"  # (17 November 2026) the plain lines of a checked answer read again by free models that wrote none of them (scripts/auto/blind_lines.py)

permissions:
  contents: write

concurrency:
  group: lane
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # a second free model service; empty until the senior author adds it, and then the lane uses it by itself
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}       # three more services with a free plan (16 November 2026); each is empty until the senior author adds its key
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main   # the newest main, not the commit that started the run: a run that waited must see what the run before it wrote
      - name: Python packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy tokenizers onnxruntime
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Work, with notes
        run: |
          set +e
          L="$RUNNER_TEMP/lane.log"; : > "$L"
          step() { echo "== $1" >> "$L"; shift; "$@" >> "$L" 2>&1; c=$?; if [ $c -ne 0 ]; then echo "!! this step failed ($c)" >> "$L"; fi; return 0; }
          step "the model client's own check" python3 -I scripts/auto/llm.py --selftest
          step "the finder's own check" python3 -I scripts/auto/papers.py --selftest
          step "the lane's own check" python3 -I scripts/auto/lane.py --selftest
          if ls data/auto/requests/probe-*.json >/dev/null 2>&1; then step "is everything within reach?" python3 -I scripts/auto/probe.py; git rm -q data/auto/requests/probe-*.json >> "$L" 2>&1; fi
          if ls data/auto/requests/exam-*.json >/dev/null 2>&1; then step "a model sits the exam as the checker" python3 -I scripts/auto/exam_models.py requests; fi
          if ls data/auto/requests/trial-*.json >/dev/null 2>&1; then step "writers tried on a real prompt" python3 -I scripts/auto/trial.py; git rm -q data/auto/requests/trial-*.json >> "$L" 2>&1; fi
          if ls data/auto/requests/grow-*.json >/dev/null 2>&1; then
            step "the question maker's own check" python3 -I scripts/auto/grow.py --selftest
            step "the system asks by itself: what people ask about every drug, where a page lacks it" python3 -I scripts/auto/grow.py run
            step "official pages for the questions not yet searched" python3 -I scripts/auto/official.py find --max 8 --minutes 6
            step "papers for the questions not yet searched" python3 -I scripts/auto/papers.py find --max 8 --minutes 8
            git rm -q data/auto/requests/grow-*.json >> "$L" 2>&1
          fi
          if ls data/auto/requests/blind-*.json >/dev/null 2>&1; then
            step "the blind reader's own check" python3 -I scripts/auto/blind_lines.py --selftest
            step "plain lines of checked answers, read again by readers who wrote none of them" python3 -I scripts/auto/blind_lines.py --requests data/auto/requests
            git rm -q data/auto/requests/blind-*.json >> "$L" 2>&1
          fi
          step "write" python3 -I scripts/auto/lane.py requests
          echo "What this run did is in data/auto/lane/_last-run.txt (cleaned of anything secret before it is kept)." >> "$GITHUB_STEP_SUMMARY"   # (16 November 2026) never the raw end of the notes
      - name: Keep the records
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/auto/lane
          python3 -I - <<'PY'
          import os, pathlib
          src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lane.log"
          t = src.read_text(encoding="utf-8", errors="replace") if src.exists() else "no notes were written\n"
          import re
          for k in ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "GROQ_API_KEY", "MISTRAL_API_KEY", "GEMINI_API_KEY", "OPENROUTER_API_KEY"):
              v = (os.environ.get(k) or "").strip()
              if len(v) >= 6: t = t.replace(v, "***")
          t = re.sub(r"(accounts/)[0-9a-fA-F]{32}", r"\1***", t)
          pathlib.Path("data/auto/lane/_last-run.txt").write_text(t[-12000:], encoding="utf-8")
          PY
          git add -A data/auto
          git diff --cached --quiet || git commit -q -m "Lane: what the system wrote, and what each gate said"
          git push -q || (git pull -q --rebase -X theirs && git push -q) || (sleep 7 && git pull -q --rebase -X theirs && git push -q)   # what a run found wins a clash with another run's copy of the same file
