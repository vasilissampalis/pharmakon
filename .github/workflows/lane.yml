# The machine lane (docs/AUTOMATION.md; scripts/auto/lane.py): answers written by the system from papers it found and read,
# each sentence tied to the paper's own words, checked by a second model and by the site's rules in code.
#
# It starts when the editor puts a request in data/auto/requests (lane-*.json: which questions, how many; probe-*.json: is
# everything within reach?), or by hand. A request is a file in the repository; it is read as data by Python and never
# reaches a command line. It needs the repository's two secrets (the senior author added them on 15 November 2026):
# CLOUDFLARE_API_TOKEN (Workers AI, Workers KV read, Pages) and CLOUDFLARE_ACCOUNT_ID. Neither is ever printed.
#
# It writes records (data/auto/answers, data/auto/lane, data/auto/papers). What the site shows of them is decided by the
# site's build (site/build.js), not here.
name: Lane

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/auto/requests/lane-*.json"
      - "data/auto/requests/probe-*.json"

permissions:
  contents: write

concurrency:
  group: lane
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Python packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy tokenizers onnxruntime
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: The lane's own checks
        run: |
          python3 -I scripts/auto/llm.py --selftest
          python3 -I scripts/auto/papers.py --selftest
          python3 -I scripts/auto/lane.py --selftest
      - name: Is everything within reach?
        run: |
          if ls data/auto/requests/probe-*.json >/dev/null 2>&1; then python3 -I scripts/auto/probe.py; git rm -q data/auto/requests/probe-*.json; fi
      - name: Write
        run: |
          python3 -I scripts/auto/lane.py requests | tee "$RUNNER_TEMP/lane.log"
          tail -n 2 "$RUNNER_TEMP/lane.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the records
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/auto/lane && tail -n 80 "$RUNNER_TEMP/lane.log" > data/auto/lane/_last-run.txt 2>/dev/null || true
          git add -A data/auto
          git diff --cached --quiet || git commit -q -m "Lane: what the system wrote, and what each gate said"
          git push -q || (git pull -q --rebase && git push -q)
