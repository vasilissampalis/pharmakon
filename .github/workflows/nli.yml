# A checker of our own that costs nothing (docs/AUTOMATION.md; scripts/auto/nli.py): small open models made to say whether a
# passage supports a sentence, run on GitHub's own machine, sit the whole exam. No secret is needed. It starts when the
# editor puts a request in data/auto/requests (nli-*.json: {"models": [...]}), or by hand, and keeps its numbers in
# data/auto/exam.
#
# Two jobs, on purpose (16 November 2026). The first fetches models and a package from outside and runs them: it may only
# READ the repository and is given no key at all. The second runs nothing from outside: it takes the first job's result
# files and writes them into the repository. So nothing fetched from outside ever runs where it could write to the
# repository or see a secret.
name: NLI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/auto/requests/nli-*.json"

permissions:
  contents: read

concurrency:
  group: nli
  cancel-in-progress: false

jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: The models fetched before
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: nli-models-v2
      - name: Python packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -q transformers sentencepiece protobuf
          .venv/bin/pip install -q lettucedetect || echo "the package for the word-marking models was not fetched"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: The exam, with notes
        run: |
          set +e
          L="$RUNNER_TEMP/nli.log"; : > "$L"
          python3 -I scripts/auto/nli.py exam --requests --minutes 38 >> "$L" 2>&1 || echo "!! failed ($?)" >> "$L"
          tail -n 60 "$L" | grep -v "Warning\|warn" | cut -c1-600 > data/auto/exam/_nli-last-run.txt
      - name: Hand the numbers to the job that may write
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-numbers
          path: data/auto/exam/
          retention-days: 3
  keep:
    needs: exam
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: The numbers the first job made
        uses: actions/download-artifact@v4
        with:
          name: exam-numbers
          path: data/auto/exam/
      - name: Keep the numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch data/auto/requests/nli-*.json
          git add -A data/auto/exam data/auto/requests
          git diff --cached --quiet || git commit -q -m "Exam: what small open checker models said of every card"
          git push -q || (git pull -q --rebase -X theirs && git push -q) || (sleep 7 && git pull -q --rebase -X theirs && git push -q)
