# The paper finder (docs/AUTOMATION.md; scripts/auto/papers.py): for the questions on our list, the searches of Europe PMC
# written down as they were sent, the papers in the order the lane would read them, and the papers that cannot be read,
# listed for the senior author with their references from Crossref. It writes no answer and publishes nothing.
#
# It needs no secret: Europe PMC and Crossref are open. It starts when the editor puts a request in data/auto/requests
# (papers-*.json), or by hand. A request is a file in the repository; it is read as data by Python and never reaches a
# command line.
name: Papers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/auto/requests/papers-*.json"

permissions:
  contents: write

concurrency:
  group: papers
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main   # the newest main, not the commit that started the run: a run that waited must see what the run before it wrote
      - name: Python packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy tokenizers onnxruntime
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Search, and put the papers in the order of reading
        run: |
          python3 -I scripts/auto/papers.py --selftest
          python3 -I scripts/auto/papers.py find --requests data/auto/requests --minutes 22 2>&1 | tee "$RUNNER_TEMP/papers.log"
          echo "What this run found is in data/auto/papers/ (see the run's commit)." >> "$GITHUB_STEP_SUMMARY"   # (16 November 2026) never the raw end of the notes
      - name: Keep what was found
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tail -n 60 "$RUNNER_TEMP/papers.log" > data/auto/papers/_last-run.txt || true
          git add -A data/auto   # (the whole folder, never the requests folder by name: when its last request is taken off, that folder is gone, and naming it made the step fail and the run's record was lost; found on 16 November 2026)
          git diff --cached --quiet || git commit -q -m "Papers: searches and the order of reading for the questions on our list"
          git push -q || (git pull -q --rebase -X theirs && git push -q) || (sleep 7 && git pull -q --rebase -X theirs && git push -q)   # what a run found wins a clash with another run's copy of the same file
