# Official pages (docs/AUTOMATION.md; scripts/auto/official.py): what health services, health ministries and agencies and the
# UN and EU bodies say. It finds out which of them this machine may read (their own robots.txt decides), keeps the addresses
# and titles of their pages about drugs, and for the questions on our list names the pages that speak about each. It writes
# no answer and publishes nothing. It needs no secret. It starts when the editor puts a request in data/auto/requests
# (official-*.json: {"do": "probe" | "index" | "find", "ids": [...]}), or by hand. A request is a file in the repository; it
# is read as data by Python and never reaches a command line.
name: Official

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/auto/requests/official-*.json"
      - "data/auto/requests/views-*.json"   # (16 November 2026) how often people look a drug up on Wikipedia: scripts/auto/wiki_views.py, for the order of the pages to start
      - "data/auto/requests/names-*.json"   # (17 November 2026, decision 26) open sources of the names of drugs and medicines: scripts/auto/names_open.py
      - "data/auto/requests/pictures-*.json"   # (17 November 2026, decision 27 step b) pictures with an open licence for the pages the system starts: scripts/auto/pictures.py

permissions:
  contents: write

concurrency:
  group: official
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main   # the newest main, not the commit that started the run
      - name: Python packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy tokenizers onnxruntime pillow   # (pillow: the web copies of the pictures the system finds, scripts/auto/pictures.py)
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Read what the request asks for, with notes
        run: |
          set +e
          L="$RUNNER_TEMP/official.log"; : > "$L"
          python3 -I scripts/auto/official.py --selftest >> "$L" 2>&1 || echo "!! the selftest failed ($?)" >> "$L"
          if ls data/auto/requests/official-*.json >/dev/null 2>&1; then
            python3 -I scripts/auto/official.py --requests data/auto/requests --minutes 25 >> "$L" 2>&1 || echo "!! failed ($?)" >> "$L"
            git rm -q --ignore-unmatch data/auto/requests/official-*.json >> "$L" 2>&1
          fi
          if ls data/auto/requests/views-*.json >/dev/null 2>&1; then
            python3 -I scripts/auto/wiki_views.py --selftest >> "$L" 2>&1 || echo "!! the page-view selftest failed ($?)" >> "$L"
            python3 -I scripts/auto/wiki_views.py --requests data/auto/requests >> "$L" 2>&1 || echo "!! the page views failed ($?)" >> "$L"
            python3 -I scripts/auto/place.py --pages >> "$L" 2>&1 || echo "!! the list of pages to start failed ($?)" >> "$L"
            git rm -q --ignore-unmatch data/auto/requests/views-*.json >> "$L" 2>&1
          fi
          if ls data/auto/requests/names-*.json >/dev/null 2>&1; then
            python3 -I scripts/auto/names_open.py --selftest >> "$L" 2>&1 || echo "!! the open names selftest failed ($?)" >> "$L"
            python3 -I scripts/auto/names_open.py --requests data/auto/requests >> "$L" 2>&1 || echo "!! the open names failed ($?)" >> "$L"
            git rm -q --ignore-unmatch data/auto/requests/names-*.json >> "$L" 2>&1
          fi
          if ls data/auto/requests/pictures-*.json >/dev/null 2>&1; then
            python3 -I scripts/auto/pictures.py --selftest >> "$L" 2>&1 || echo "!! the pictures selftest failed ($?)" >> "$L"
            python3 -I scripts/auto/pictures.py --requests data/auto/requests >> "$L" 2>&1 || echo "!! the pictures failed ($?)" >> "$L"
            git rm -q --ignore-unmatch data/auto/requests/pictures-*.json >> "$L" 2>&1
          fi
          mkdir -p data/auto/official
          tail -n 80 "$L" | cut -c1-600 > data/auto/official/_last-run.txt
      - name: Keep what was found
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d site/photos-auto ]; then git add -A site/photos-auto; fi   # (the web copies of the pictures the system fetched: scripts/auto/pictures.py)
          git add -A data/auto   # (the whole folder, never the requests folder by name: when its last request is taken off, that folder is gone, and naming it made the step fail and the run's record was lost; found on 16 November 2026)
          git diff --cached --quiet || git commit -q -m "Official: what the official bodies' sites allowed and what was found"
          git push -q || (git pull -q --rebase -X theirs && git push -q) || (sleep 7 && git pull -q --rebase -X theirs && git push -q)   # what a run found wins a clash with another run's copy of the same file
